name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The token gets no permission by default; every job below only reads the repository.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  suite:
    name: Test suite (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install SQLite headers, Clang, Go and Valgrind where missing
        run: |
          PKGS=""
          [ -f /usr/include/sqlite3.h ] || PKGS="$PKGS libsqlite3-dev"
          command -v clang >/dev/null 2>&1 || PKGS="$PKGS clang"
          command -v go >/dev/null 2>&1 || PKGS="$PKGS golang-go"
          command -v valgrind >/dev/null 2>&1 || PKGS="$PKGS valgrind"
          if [ -n "$PKGS" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends $PKGS
          fi

      - name: Build the compiler with warnings as errors
        run: make -j"$(nproc)" WARN="-Wall -Wextra -Wno-unused-parameter -Wformat=2 -Werror"

      - name: Check the formatting of every .brat file
        run: ./lang/cxx/bin/brat-cxx fmt --check $(git ls-files '*.brat')

      - name: Run shard ${{ matrix.shard }}/2 of the test suite
        run: python3 lang/tests/run_all.py --shard "${{ matrix.shard }}/2" -j "$(nproc)"

  sanitizers:
    name: Compiler under ASan, UBSan and LSan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install SQLite headers, Clang and Valgrind where missing
        run: |
          PKGS=""
          [ -f /usr/include/sqlite3.h ] || PKGS="$PKGS libsqlite3-dev"
          command -v clang >/dev/null 2>&1 || PKGS="$PKGS clang"
          command -v valgrind >/dev/null 2>&1 || PKGS="$PKGS valgrind"
          if [ -n "$PKGS" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends $PKGS
          fi

      - name: Build the release and the instrumented compiler
        run: |
          make -j"$(nproc)"
          make -j"$(nproc)" asan

      - name: Check and emit every .brat file with the instrumented compiler
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:exitcode=99
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          status=0
          for file in $(git ls-files '*.brat'); do
            for command in check emit-c; do
              report=$(./lang/cxx/bin/brat-cxx-asan "$command" "$file" 2>&1 >/dev/null) && code=0 || code=$?
              if [ "$code" -eq 99 ] || grep -qE 'AddressSanitizer|LeakSanitizer|runtime error:' <<<"$report"; then
                echo "::error file=$file::sanitizer report from brat-cxx $command"
                echo "$report" | tail -n 30
                status=1
              fi
            done
          done
          exit "$status"

      - name: Run the suites that take BRAT_CXX under the instrumented compiler
        env:
          BRAT_CXX: ${{ github.workspace }}/lang/cxx/bin/brat-cxx-asan
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: |
          python3 lang/tests/test_bitwise.py
          python3 lang/tests/test_runtime_json_enum.py
          python3 lang/tests/test_defer_try_soundness.py
          python3 lang/tests/test_bindgen_preprocess_sys.py
          python3 lang/tests/test_dwarf_pax_parfor.py
          python3 lang/tests/test_examples_and_valgrind.py
          python3 lang/tests/test_shaped_map_ic.py
          python3 lang/tests/test_structs.py
          python3 lang/tests/test_typed_enums.py
          python3 lang/tests/test_struct_sra.py

  macos-arm64:
    name: Native macOS (arm64)
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build native compiler with Apple Clang
        timeout-minutes: 10
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Verify symlink launcher, frontend, checker, borrow and conformance corpus
        timeout-minutes: 15
        run: |
          ./bin/brat run examples/hello.brat
          ./bin/brat run examples/json_arena.brat
          python3 lang/tests/test_agreement.py
          python3 lang/tests/run_all.py -j "$(sysctl -n hw.ncpu)" \
            test_cxx_frontend.py \
            test_cxx_checker.py \
            test_cxx_borrow.py \
            test_cxx_modules.py \
            test_bitwise.py \
            test_runtime_json_enum.py \
            test_defer_try_soundness.py \
            test_structs.py \
            test_typed_enums.py \
            test_struct_sra.py \
            test_stack_depth.py \
            test_lsp.py

  windows-x86_64:
    name: Native Windows (x86_64 LLP64)
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build native compiler with MinGW-w64 and run LLP64 verification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          New-Item -ItemType Directory -Force -Path lang/cxx/bin | Out-Null
          $srcs = Get-ChildItem lang/cxx/src/*.cpp | ForEach-Object { $_.FullName }
          & g++ -std=c++20 -O2 -Wall -Wextra -Wno-unused-parameter -static $srcs -lws2_32 -o lang/cxx/bin/brat-cxx.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./lang/cxx/bin/brat-cxx.exe run examples/hello.brat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./lang/cxx/bin/brat-cxx.exe run examples/json_arena.brat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python lang/tests/run_all.py -j $env:NUMBER_OF_PROCESSORS `
            test_cxx_frontend.py `
            test_cxx_checker.py `
            test_cxx_borrow.py `
            test_cxx_modules.py `
            test_bitwise.py `
            test_runtime_json_enum.py `
            test_structs.py `
            test_typed_enums.py `
            test_struct_sra.py `
            test_stack_depth.py `
            test_lsp.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
